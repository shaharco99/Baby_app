name: Android CI

on:
  push:
    branches: [main, 'feature/**']
    paths: ['android/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-ci.yml']

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # versionName is derived from the newest v* tag, so the build needs tag history.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The configuration cache is only saved between runs when it can be encrypted (it can hold
      # secrets); with the secret unset this input is empty and setup-gradle just skips it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # setup-gradle only caches ~/.gradle; Kotlin's own incremental-compile state
      # lives under each module's build/ dir and is lost on every fresh runner,
      # forcing a full (non-incremental) recompile every run otherwise.
      - uses: actions/cache@v6
        with:
          path: |
            android/**/build/kotlin
            android/**/build/tmp/kotlin-classes
          key: kotlin-incremental-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            kotlin-incremental-${{ runner.os }}-${{ github.ref }}-
            kotlin-incremental-${{ runner.os }}-

      - name: Test, lint, assemble
        working-directory: android
        run: ./gradlew test lint assembleDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7
