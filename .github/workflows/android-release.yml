name: Android Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # A release is only cut from a build that passed its checks.
      - name: Test and lint
        working-directory: android
        run: ./gradlew test lint

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. An unsigned release cannot be installed as an update."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Check Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL/SUPABASE_ANON_KEY is not set. A release built without it crashes on launch (Koin fails constructing the Supabase client)."
            exit 1
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # ORG_GRADLE_PROJECT_<name> is Gradle's own convention for exposing an env var as a
          # project property — picked up by :core:network's `connectionSetting()` fallback to
          # `providers.gradleProperty(name)` when no local.properties exists (CI has none).
          ORG_GRADLE_PROJECT_supabaseUrl: ${{ secrets.SUPABASE_URL }}
          ORG_GRADLE_PROJECT_supabaseAnonKey: ${{ secrets.SUPABASE_ANON_KEY }}
          ORG_GRADLE_PROJECT_googleWebClientId: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ORG_GRADLE_PROJECT_googleCalendarOauthClientId: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew :app:assembleRelease

      - name: Package release assets
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APK_SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          APK_NAME="or-yareach-${VERSION}.apk"
          mkdir -p dist
          cp "$APK_SRC" "dist/$APK_NAME"

          SHA=$(sha256sum "dist/$APK_NAME" | cut -d' ' -f1)
          SIZE=$(stat -c%s "dist/$APK_NAME")
          VERSION_CODE=$(( ${VERSION%%.*} * 10000 \
            + $(echo "$VERSION" | cut -d. -f2 | cut -d- -f1) * 100 \
            + $(echo "$VERSION" | cut -d. -f3 | cut -d- -f1) ))
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # Release notes are the commit subjects since the previous tag.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            NOTES=$(git log --no-merges --pretty=format:'%s' "$PREV..$TAG")
          else
            NOTES=$(git log --no-merges --pretty=format:'%s' -20 "$TAG")
          fi
          echo "$NOTES" > dist/notes.txt

          jq -n \
            --arg version "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --arg date "$(date -u +%Y-%m-%d)" \
            --arg url "${BASE}/${APK_NAME}" \
            --arg sha "$SHA" \
            --argjson size "$SIZE" \
            --arg releaseUrl "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --rawfile notes dist/notes.txt \
            '{
              version: $version,
              versionCode: $versionCode,
              release_date: $date,
              mandatory: false,
              release_url: $releaseUrl,
              notes: ($notes | split("\n") | map(select(length > 0))),
              asset: { url: $url, sha256: $sha, sizeBytes: $size }
            }' > dist/manifest.json

          echo "$SHA  $APK_NAME" > dist/SHA256SUMS.txt
          cat dist/manifest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/manifest.json
            dist/SHA256SUMS.txt
          body_path: dist/notes.txt
          fail_on_unmatched_files: true
